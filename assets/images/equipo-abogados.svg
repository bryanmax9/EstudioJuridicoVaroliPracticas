<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2D4F"/>
      <stop offset="100%" style="stop-color:#2E4A7A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tg)"/>
  <!-- mesa de reunión -->
  <ellipse cx="300" cy="310" rx="220" ry="55" fill="rgba(139,100,40,0.25)" stroke="rgba(201,160,104,0.3)" stroke-width="2"/>
  <!-- personas -->
  <circle cx="150" cy="220" r="32" fill="rgba(46,74,122,0.7)" stroke="rgba(201,160,104,0.4)" stroke-width="2"/>
  <line x1="150" y1="252" x2="150" y2="290" stroke="rgba(46,74,122,0.7)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="300" cy="200" r="36" fill="rgba(27,45,79,0.8)" stroke="rgba(201,160,104,0.6)" stroke-width="2.5"/>
  <line x1="300" y1="236" x2="300" y2="282" stroke="rgba(27,45,79,0.8)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="450" cy="220" r="32" fill="rgba(46,74,122,0.7)" stroke="rgba(201,160,104,0.4)" stroke-width="2"/>
  <line x1="450" y1="252" x2="450" y2="290" stroke="rgba(46,74,122,0.7)" stroke-width="18" stroke-linecap="round"/>
  <!-- documentos sobre mesa -->
  <rect x="230" y="295" width="60" height="44" fill="rgba(248,245,239,0.15)" rx="2" stroke="rgba(201,160,104,0.3)" stroke-width="1"/>
  <rect x="310" y="295" width="55" height="44" fill="rgba(248,245,239,0.1)" rx="2" stroke="rgba(201,160,104,0.2)" stroke-width="1"/>
  <!-- líneas habla -->
  <line x1="150" y1="200" x2="200" y2="220" stroke="rgba(201,160,104,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="450" y1="200" x2="400" y2="220" stroke="rgba(201,160,104,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="380" text-anchor="middle" font-family="serif" font-size="11" fill="rgba(201,160,104,0.35)" letter-spacing="4">VAROLI ABOGADOS</text>
</svg>