<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agenda — Varoli-Slovsa Abogados</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1A3C;
    --navy-2:#132a5c;
    --gold:#C9A227;
    --gold-2:#e0bb3d;
    --cream:#F3EFE6;
    --card:#FFFFFF;
    --ink:#20242c;
    --muted:#6b7280;
    --line:#e7e2d6;
    --red:#B4432C;
    --green:#2f6b4f;
    --blue:#2b4f7c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Lato',sans-serif;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1180px;margin:0 auto;padding:36px 28px 80px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:16px;}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:2.4rem;color:var(--navy);margin:0;}
  .subtitle{color:var(--muted);font-size:0.98rem;margin-top:6px;}
  .btn-new{background:var(--gold);color:var(--navy);font-weight:700;border:none;padding:12px 22px;border-radius:999px;cursor:pointer;font-size:0.95rem;font-family:'Lato',sans-serif;white-space:nowrap;}
  .btn-new:hover{background:var(--gold-2);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 18px;flex-wrap:wrap;gap:14px;}
  .monthnav{display:flex;align-items:center;gap:14px;}
  .monthnav button{border:1.5px solid var(--navy);background:#fff;color:var(--navy);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;font-weight:700;}
  .monthnav button:hover{background:var(--navy);color:#fff;}
  .monthnav .label{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--navy);font-weight:600;min-width:200px;text-align:center;}
  .today-btn{border:1.5px solid var(--navy);background:transparent;color:var(--navy);padding:8px 16px;border-radius:999px;font-weight:700;font-size:0.85rem;cursor:pointer;}
  .legend{display:flex;gap:16px;font-size:0.82rem;color:var(--muted);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot-reunion{background:var(--blue);}
  .dot-vencimiento{background:var(--red);}
  .dot-tarea{background:var(--gold);}

  .cal{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1.5px solid var(--line);}
  .cal-head div{padding:12px 0;text-align:center;font-size:0.78rem;font-weight:700;color:var(--navy);letter-spacing:.03em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:112px;}
  .day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;position:relative;cursor:pointer;overflow:hidden;}
  .day:nth-child(7n){border-right:none;}
  .day:hover{background:#faf8f2;}
  .day.other-month{background:#f8f6f0;color:#c3bda9;}
  .day.today .daynum{background:var(--gold);color:var(--navy);}
  .daynum{font-size:0.82rem;font-weight:700;color:var(--ink);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .evchip{margin-top:5px;padding:2px 7px;border-radius:6px;font-size:0.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .evchip.reunion{background:#dde6f1;color:var(--blue);}
  .evchip.vencimiento{background:#f6e2dd;color:var(--red);}
  .evchip.tarea{background:#f3e9c9;color:#7a5c17;}
  .more{font-size:0.7rem;color:var(--muted);margin-top:3px;cursor:pointer;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,26,60,.45);display:none;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:50;overflow:auto;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:30px 30px 26px;}
  .modal h2{font-family:'Playfair Display',serif;color:var(--navy);margin:0 0 20px;font-size:1.35rem;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.8rem;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:'Lato',sans-serif;font-size:0.92rem;color:var(--ink);}
  .field textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .btn-save{background:var(--navy);color:#fff;font-weight:700;border:none;padding:11px 24px;border-radius:999px;cursor:pointer;font-size:0.9rem;}
  .btn-cancel{background:transparent;color:var(--muted);border:none;font-weight:600;cursor:pointer;font-size:0.88rem;}
  .btn-delete{background:transparent;color:var(--red);border:none;font-weight:700;cursor:pointer;font-size:0.85rem;}
  .note{margin-top:16px;font-size:0.82rem;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">Nuevo evento</h2>
    <div class="field">
      <label>Título</label>
      <input id="f-title" type="text" placeholder="Ej: Audiencia — Rocer Security">
    </div>
    <div class="row2">
      <div class="field">
        <label>Fecha</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label>Hora</label>
        <input id="f-time" type="time">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Tipo</label>
        <select id="f-type">
          <option>Reunión</option>
          <option>Audiencia</option>
          <option>Vencimiento</option>
          <option>Tarea</option>
        </select>
      </div>
      <div class="field">
        <label>Modalidad</label>
        <select id="f-modalidad">
          <option value="">—</option>
          <option value="PRESENCIAL">Presencial</option>
          <option value="VIRTUAL">Virtual</option>
          <option value="TELEFÓNICA">Telefónica</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Cliente</label>
      <input id="f-cliente" type="text" placeholder="Ej: Correos del Perú">
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="f-desc" placeholder="Detalle del evento o tarea..."></textarea>
    </div>
    <div class="field">
      <label>Enlace (Meet / Drive)</label>
      <input id="f-link" type="text" placeholder="https://meet.google.com/...">
    </div>
    <div class="modal-actions">
      <button class="btn-delete" id="btn-delete" style="display:none;">Eliminar</button>
      <div>
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveEvent()">Guardar</button>
      </div>
    </div>
  </div>
</div>

  const grid = document.getElementById('grid');
  grid.innerHTML = cells.map(c=>{
    const realM = ((c.m % 12)+12)%12;
    const realY = c.y + Math.floor(c.m/12) - (c.m<0?1:0);
    const iso = isoDate(realY, realM, c.day);
    const isToday = !c.other && iso === isoDate(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
    const evs = (byDate[iso]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const shown = evs.slice(0,3);
    const rest = evs.length - shown.length;
    return `<div class="day ${c.other?'other-month':''} ${isToday?'today':''}" onclick="openNewOnDate('${iso}', event)">
      <div class="daynum">${c.day}</div>
      ${shown.map(e=>`<div class="evchip ${typeClass(e.type)}" onclick="openEdit('${e.id}', event)">${e.time?e.time+' · ':''}${e.title}</div>`).join('')}
      ${rest>0?`<div class="more">+${rest} más</div>`:''}
    </div>`;
  }).join('');
}

function changeMonth(delta){ cursor = new Date(cursor.getFullYear(), cursor.getMonth()+delta, 1); render(); }
function goToday(){ cursor = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); render(); }

function openNew(){
  editingId = null;
  document.getElementById('modal-title').textContent = 'Nuevo evento';
  ['f-title','f-date','f-time','f-cliente','f-desc','f-link'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-type').value = 'Reunión';
  document.getElementById('f-modalidad').value = '';
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('overlay').classList.add('show');
}
function openNewOnDate(iso, ev){
  ev.stopPropagation();
  openNew();
  document.getElementById('f-date').value = iso;
}
function openEdit(id, ev){
  ev.stopPropagation();
  const e = EVENTS.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Editar evento';
  document.getElementById('f-title').value = e.title || '';
  document.getElementById('f-date').value = e.date || '';
  document.getElementById('f-time').value = to24h(e.time) || '';
  document.getElementById('f-type').value = normType(e.type);
  document.getElementById('f-modalidad').value = e.modalidad || '';
  document.getElementById('f-cliente').value = e.cliente || '';
  document.getElementById('f-desc').value = e.description || '';
  document.getElementById('f-link').value = e.link || '';
  document.getElementById('btn-delete').style.display = 'inline-block';
  document.getElementById('btn-delete').onclick = ()=>{ EVENTS = EVENTS.filter(x=>x.id!==id); closeModal(); render(); };
  document.getElementById('overlay').classList.add('show');
}
function normType(t){
  const opts = ['Reunión','Audiencia','Vencimiento','Tarea'];
  return opts.includes(t) ? t : 'Tarea';
}
function to24h(t){
  if(!t) return '';
  const m = t.match(/(\d{1,2}):(\d{2})\s*([AP]M)?/i);
  if(!m) return '';
  let h = parseInt(m[1],10), min = m[2];
  if(m[3]){ const ap = m[3].toUpperCase(); if(ap==='PM' && h<12) h+=12; if(ap==='AM' && h===12) h=0; }
  return pad(h)+':'+min;
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

function saveEvent(){
  const title = document.getElementById('f-title').value.trim();
  const date = document.getElementById('f-date').value;
  if(!title || !date){ alert('Falta título o fecha.'); return; }
  const data = {
    title,
    date,
    time: document.getElementById('f-time').value,
    type: document.getElementById('f-type').value,
    modalidad: document.getElementById('f-modalidad').value,
    cliente: document.getElementById('f-cliente').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    link: document.getElementById('f-link').value.trim(),
  };
  if(editingId){
    const idx = EVENTS.findIndex(x=>x.id===editingId);
    EVENTS[idx] = {...EVENTS[idx], ...data};
  } else {
    const newId = 'EV-' + String(EVENTS.length+1).padStart(3,'0') + '-' + Date.now()%1000;
    EVENTS.push({id:newId, ...data});
  }
  closeModal();
  render();
}

render();
</script>
