<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Acceso al panel · Varoli - Slovsa Abogados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-mono">VS</div>
    <div class="login-brand">Varoli - Slovsa Abogados</div>
    <div class="login-sub">Sistema de Arbitraje · acceso exclusivo del equipo</div>

    <form id="loginForm">
      <label class="login-label" for="email">Correo</label>
      <input class="login-input" type="email" id="email" name="email" autocomplete="username" required>

      <label class="login-label" for="password">Contraseña</label>
      <input class="login-input" type="password" id="password" name="password" autocomplete="current-password" required>

      <div id="loginError" class="login-error"></div>

      <button class="btn gold login-btn" type="submit" id="loginBtn">Iniciar sesión</button>
    </form>

    <a href="../index.html" class="login-back">← Volver al sitio</a>
  </div>
</div>

<script>
(function () {
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  // If a valid session already exists, skip straight to the dashboard.
  fetch('/.netlify/functions/panel-session', { credentials: 'same-origin' })
    .then((r) => r.json())
    .then((data) => {
      if (data && data.authenticated) window.location.replace('dashboard.html');
    })
    .catch(() => {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorBox.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Ingresando…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    fetch('/.netlify/functions/panel-login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'No se pudo iniciar sesión.');
        window.location.href = 'dashboard.html';
      })
      .catch((err) => {
        showError(err.message || 'Correo o contraseña incorrectos.');
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      });
  });
})();
</script>
</body>
</html>
